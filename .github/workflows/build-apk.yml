name: Build APK

# Manual dispatch only (the retrieval step commits build output back to this
# branch, so auto-triggering on push would loop).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK (shells + aapt2 runtime + factory)
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniversalApkFactory-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish build output to the branch (retrieval path)
        if: success()
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/
          git commit -m "ci: automated debug build output [skip ci]"
          git push
