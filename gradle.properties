# Project-wide Gradle settings for Universal APK Factory & Studio.

# AndroidX is mandatory (the entire UI is Jetpack Compose Material 3).
android.useAndroidX=true
android.enableJetifier=false

# Non-transitive R classes keep the shell APKs and the factory small.
android.nonTransitiveRClass=true

# The build host needs enough heap for AGP + Kotlin compilation.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# Kotlin
kotlin.code.style=official
